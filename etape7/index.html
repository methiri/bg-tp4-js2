
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Performance & Récompenses</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>🏆 Espace Performance</h1>
            <p>Découvrez les performances et récompenses des participants</p>
        </header>

        <!-- Fonctionnalité 1 : Podium des meilleurs participants -->
        <section>
            <h2>🏆 Le podium des champions</h2>
            <div id="podium" class="podium"></div>
        </section>

        <!-- Fonctionnalité 2 : Indicateurs de performance -->
        <section>
            <h2>📊 Radar de performance</h2>
            <div id="performances"></div>
        </section>

        <!-- Fonctionnalité 3 : Attribution automatique des badges -->
        <section>
            <h2>🎖️ Galerie des récompenses</h2>
            <div id="rewards" class="rewards"></div>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
